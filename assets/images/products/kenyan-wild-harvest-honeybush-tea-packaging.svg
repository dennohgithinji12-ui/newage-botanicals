<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background Radial Studio Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#142b1f"/>
      <stop offset="55%" stop-color="#091710"/>
      <stop offset="100%" stop-color="#040a07"/>
    </radialGradient>

    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8B3"/>
      <stop offset="25%" stop-color="#C49A45"/>
      <stop offset="50%" stop-color="#EED596"/>
      <stop offset="75%" stop-color="#8C6721"/>
      <stop offset="100%" stop-color="#E2B755"/>
    </linearGradient>

    <!-- Glass Shading Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241c11"/>
      <stop offset="25%" stop-color="#b89154"/>
      <stop offset="50%" stop-color="#241c11"/>
      <stop offset="75%" stop-color="#0a0503"/>
      <stop offset="100%" stop-color="#241c11"/>
    </linearGradient>

    <!-- Specular Reflection -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Kraft Gradient -->
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70502e"/>
      <stop offset="35%" stop-color="#997043"/>
      <stop offset="70%" stop-color="#7d5932"/>
      <stop offset="100%" stop-color="#5c3f21"/>
    </linearGradient>

    <!-- Obsidian Pouch Gradient -->
    <linearGradient id="obsidianPouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="35%" stop-color="#19191d"/>
      <stop offset="70%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#060607"/>
    </linearGradient>

    <!-- Copper Pouch Gradient -->
    <linearGradient id="copperPouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d2413"/>
      <stop offset="35%" stop-color="#9c4e2b"/>
      <stop offset="70%" stop-color="#6e351d"/>
      <stop offset="100%" stop-color="#3d1b0c"/>
    </linearGradient>

    <!-- Metal Tin Gradient -->
    <linearGradient id="tinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102118"/>
      <stop offset="30%" stop-color="#1e3d2c"/>
      <stop offset="60%" stop-color="#2a523c"/>
      <stop offset="85%" stop-color="#152b1f"/>
      <stop offset="100%" stop-color="#0c1912"/>
    </linearGradient>

    <!-- Wood Cap Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#693b1b"/>
      <stop offset="50%" stop-color="#40200c"/>
      <stop offset="100%" stop-color="#291306"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="dropShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)"/>

  <!-- Apothecary Stage Floor Shadow & Pedestal Glow -->
  <ellipse cx="300" cy="515" rx="210" ry="34" fill="#000000" opacity="0.6" filter="blur(8px)"/>
  <ellipse cx="300" cy="505" rx="140" ry="18" fill="#C99E4A" opacity="0.08" filter="blur(6px)"/>

  <!-- Packaging Physical Model -->
  
      <!-- Vintage Square Metal Caddy with Clasp -->
      <rect x="215" y="160" width="170" height="310" rx="8" fill="url(#tinGrad)" filter="url(#dropShadow)"/>
      <rect x="210" y="135" width="180" height="35" rx="5" fill="url(#goldGrad)"/>
      <circle cx="300" cy="180" r="8" fill="url(#goldGrad)" stroke="#66440A" stroke-width="1"/>

      <!-- Label -->
      <rect x="235" y="210" width="130" height="235" rx="4" fill="#F9F5EC" stroke="#C99E4A" stroke-width="1.5"/>
      <rect x="239" y="214" width="122" height="227" rx="3" fill="none" stroke="#C99E4A" stroke-width="0.8" stroke-dasharray="3,2"/>
    

  <!-- Center Label Typography & Details -->
  <g id="labelContent">
    <!-- Brand Crest -->
    <circle cx="300" cy="226" r="13" fill="#594420"/>
    
      <polygon points="300,217 309,226 300,235 291,226" fill="none" stroke="#C99E4A" stroke-width="1.2"/>
      <polygon points="300,221 305,226 300,231 295,226" fill="#C99E4A"/>
    

    <!-- Brand Header -->
    <text x="300" y="247" font-family="'Cinzel', Georgia, serif" font-size="6.5" font-weight="bold" fill="#21180A" text-anchor="middle" letter-spacing="1.4">NEWAGE BOTANICALS</text>
    <line x1="265" y1="251" x2="335" y2="251" stroke="#C99E4A" stroke-width="0.8"/>

    <!-- Product Title -->
    <text x="300" y="264" font-family="'Playfair Display', Georgia, serif" font-size="8.5" font-weight="bold" fill="#21180A" text-anchor="middle">Wild Mountain</text><text x="300" y="274" font-family="'Playfair Display', Georgia, serif" font-size="8.5" font-weight="bold" fill="#21180A" text-anchor="middle">Honeybush &amp; Vanilla</text><text x="300" y="284" font-family="'Playfair Display', Georgia, serif" font-size="8.5" font-weight="bold" fill="#21180A" text-anchor="middle">Tisane</text>

    <!-- Latin Binomial -->
    <text x="300" y="298" font-family="Georgia, serif" font-style="italic" font-size="6" fill="#735B30" text-anchor="middle">Cyclopia intermedia</text>

    <!-- Extraction Badge -->
    <rect x="256" y="306" width="88" height="13" rx="2.5" fill="#594420"/>
    <text x="300" y="315" font-family="sans-serif" font-size="4.5" font-weight="bold" fill="#FFF" text-anchor="middle" letter-spacing="0.4">100% THERAPEUTIC PURITY</text>

    <!-- Net Quantity & Lot -->
    <line x1="260" y1="408" x2="340" y2="408" stroke="#C99E4A" stroke-width="0.75"/>
    <text x="300" y="418" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="bold" fill="#21180A" text-anchor="middle">100G · 3.5 OZ (40 Loose Servings)</text>
    <text x="300" y="427" font-family="'JetBrains Mono', monospace" font-size="4.5" fill="#735B30" text-anchor="middle">NAB-2026-KENY-001</text>

    <!-- Contact & Brand Channels Prominently on Label -->
    <text x="300" y="435" font-family="sans-serif" font-size="4" font-weight="bold" fill="#C99E4A" text-anchor="middle">TEL: +254141270112 · @newagebotanicals</text>
  </g>

  <!-- Top Apothecary Luxury Header Overlay -->
  <g opacity="0.85">
    <text x="30" y="42" font-family="'Cinzel', Georgia, serif" font-size="9" font-weight="bold" fill="#C99E4A" letter-spacing="2">NEWAGE HEALTH BOTANICALS</text>
    <text x="30" y="55" font-family="sans-serif" font-size="6.5" fill="#88A092" letter-spacing="1">AUTHENTIC PACKAGING · DISPENSARY GRADE</text>
  </g>

  <!-- Bottom Origin Badge & Direct Contact Verification -->
  <g opacity="0.85">
    <text x="570" y="562" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#C99E4A" text-anchor="end">NAB-2026-KENY-001</text>
    <text x="570" y="574" font-family="sans-serif" font-size="6" fill="#88A092" text-anchor="end">Great Rift Valley Foothills · Laikipia</text>
    <text x="570" y="584" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#C99E4A" text-anchor="end">TEL: +254141270112 | @newagebotanicals</text>
  </g>
</svg>