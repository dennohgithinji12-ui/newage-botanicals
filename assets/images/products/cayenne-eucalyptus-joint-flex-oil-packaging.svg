<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background Radial Studio Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#142b1f"/>
      <stop offset="55%" stop-color="#091710"/>
      <stop offset="100%" stop-color="#040a07"/>
    </radialGradient>

    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8B3"/>
      <stop offset="25%" stop-color="#C49A45"/>
      <stop offset="50%" stop-color="#EED596"/>
      <stop offset="75%" stop-color="#8C6721"/>
      <stop offset="100%" stop-color="#E2B755"/>
    </linearGradient>

    <!-- Glass Shading Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#240d04"/>
      <stop offset="25%" stop-color="#9c3c12"/>
      <stop offset="50%" stop-color="#240d04"/>
      <stop offset="75%" stop-color="#0a0503"/>
      <stop offset="100%" stop-color="#240d04"/>
    </linearGradient>

    <!-- Specular Reflection -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Kraft Gradient -->
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70502e"/>
      <stop offset="35%" stop-color="#997043"/>
      <stop offset="70%" stop-color="#7d5932"/>
      <stop offset="100%" stop-color="#5c3f21"/>
    </linearGradient>

    <!-- Obsidian Pouch Gradient -->
    <linearGradient id="obsidianPouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="35%" stop-color="#19191d"/>
      <stop offset="70%" stop-color="#111114"/>
      <stop offset="100%" stop-color="#060607"/>
    </linearGradient>

    <!-- Copper Pouch Gradient -->
    <linearGradient id="copperPouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d2413"/>
      <stop offset="35%" stop-color="#9c4e2b"/>
      <stop offset="70%" stop-color="#6e351d"/>
      <stop offset="100%" stop-color="#3d1b0c"/>
    </linearGradient>

    <!-- Metal Tin Gradient -->
    <linearGradient id="tinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#102118"/>
      <stop offset="30%" stop-color="#1e3d2c"/>
      <stop offset="60%" stop-color="#2a523c"/>
      <stop offset="85%" stop-color="#152b1f"/>
      <stop offset="100%" stop-color="#0c1912"/>
    </linearGradient>

    <!-- Wood Cap Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#693b1b"/>
      <stop offset="50%" stop-color="#40200c"/>
      <stop offset="100%" stop-color="#291306"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="dropShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)"/>

  <!-- Apothecary Stage Floor Shadow & Pedestal Glow -->
  <ellipse cx="300" cy="515" rx="210" ry="34" fill="#000000" opacity="0.6" filter="blur(8px)"/>
  <ellipse cx="300" cy="505" rx="140" ry="18" fill="#E6A853" opacity="0.08" filter="blur(6px)"/>

  <!-- Packaging Physical Model -->
  
      <!-- Modern Rectangular Elixir Bottle -->
      <rect x="278" y="70" width="44" height="42" rx="4" fill="url(#goldGrad)" stroke="#8C6721" stroke-width="1.5"/>
      <line x1="278" y1="85" x2="322" y2="85" stroke="#66460C" stroke-width="1.2"/>
      <rect x="286" y="112" width="28" height="18" fill="url(#glassGrad)"/>
      <rect x="235" y="130" width="130" height="340" rx="8" fill="url(#glassGrad)" filter="url(#dropShadow)"/>
      <rect x="238" y="135" width="24" height="330" fill="#FFF" opacity="0.12"/>
      <rect x="345" y="135" width="16" height="330" fill="#000" opacity="0.25"/>

      <!-- Label -->
      <rect x="245" y="175" width="110" height="265" rx="3" fill="#FBF2EB" stroke="#E6A853" stroke-width="1.5"/>
      <rect x="248" y="178" width="104" height="259" rx="2" fill="none" stroke="#E6A853" stroke-width="0.75" stroke-dasharray="3,2"/>
    

  <!-- Center Label Typography & Details -->
  <g id="labelContent">
    <!-- Brand Crest -->
    <circle cx="300" cy="226" r="13" fill="#6E2506"/>
    
      <circle cx="300" cy="226" r="5" fill="#E6A853"/>
      <line x1="300" y1="216" x2="300" y2="220" stroke="#E6A853" stroke-width="1.5"/>
      <line x1="300" y1="232" x2="300" y2="236" stroke="#E6A853" stroke-width="1.5"/>
      <line x1="290" y1="226" x2="294" y2="226" stroke="#E6A853" stroke-width="1.5"/>
      <line x1="306" y1="226" x2="310" y2="226" stroke="#E6A853" stroke-width="1.5"/>
    

    <!-- Brand Header -->
    <text x="300" y="247" font-family="'Cinzel', Georgia, serif" font-size="6.5" font-weight="bold" fill="#290E03" text-anchor="middle" letter-spacing="1.4">NEWAGE BOTANICALS</text>
    <line x1="265" y1="251" x2="335" y2="251" stroke="#E6A853" stroke-width="0.8"/>

    <!-- Product Title -->
    <text x="300" y="264" font-family="'Playfair Display', Georgia, serif" font-size="8.5" font-weight="bold" fill="#290E03" text-anchor="middle">Volcanic Cayenne &amp;</text><text x="300" y="274" font-family="'Playfair Display', Georgia, serif" font-size="8.5" font-weight="bold" fill="#290E03" text-anchor="middle">Blue Gum Eucalyptus</text><text x="300" y="284" font-family="'Playfair Display', Georgia, serif" font-size="8.5" font-weight="bold" fill="#290E03" text-anchor="middle">Flex Oil</text>

    <!-- Latin Binomial -->
    <text x="300" y="298" font-family="Georgia, serif" font-style="italic" font-size="6" fill="#8C3711" text-anchor="middle">Capsicum frutescens &amp; Eucalyptus globulus</text>

    <!-- Extraction Badge -->
    <rect x="256" y="306" width="88" height="13" rx="2.5" fill="#6E2506"/>
    <text x="300" y="315" font-family="sans-serif" font-size="4.5" font-weight="bold" fill="#FFF" text-anchor="middle" letter-spacing="0.4">100% THERAPEUTIC PURITY</text>

    <!-- Net Quantity & Lot -->
    <line x1="260" y1="408" x2="340" y2="408" stroke="#E6A853" stroke-width="0.75"/>
    <text x="300" y="418" font-family="'JetBrains Mono', monospace" font-size="5.5" font-weight="bold" fill="#290E03" text-anchor="middle">50 ML · 1.7 FL. OZ</text>
    <text x="300" y="427" font-family="'JetBrains Mono', monospace" font-size="4.5" fill="#8C3711" text-anchor="middle">NAB-2026-CAYE-001</text>

    <!-- Contact & Brand Channels Prominently on Label -->
    <text x="300" y="435" font-family="sans-serif" font-size="4" font-weight="bold" fill="#E6A853" text-anchor="middle">TEL: +254141270112 · @newagebotanicals</text>
  </g>

  <!-- Top Apothecary Luxury Header Overlay -->
  <g opacity="0.85">
    <text x="30" y="42" font-family="'Cinzel', Georgia, serif" font-size="9" font-weight="bold" fill="#E6A853" letter-spacing="2">NEWAGE HEALTH BOTANICALS</text>
    <text x="30" y="55" font-family="sans-serif" font-size="6.5" fill="#88A092" letter-spacing="1">AUTHENTIC PACKAGING · DISPENSARY GRADE</text>
  </g>

  <!-- Bottom Origin Badge & Direct Contact Verification -->
  <g opacity="0.85">
    <text x="570" y="562" font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#E6A853" text-anchor="end">NAB-2026-CAYE-001</text>
    <text x="570" y="574" font-family="sans-serif" font-size="6" fill="#88A092" text-anchor="end">Mount Kenya Volcanic Slopes · Meru</text>
    <text x="570" y="584" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#E6A853" text-anchor="end">TEL: +254141270112 | @newagebotanicals</text>
  </g>
</svg>