name: Deploy Cloudflare D1 SQLite Database

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'functions/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  deploy-d1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Apply Cloudflare D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deploying D1 migrations to Cloudflare..."
            npx wrangler d1 execute newage-botanicals-db --remote --file=migrations/0001_initial_schema.sql
            npx wrangler d1 execute newage-botanicals-db --remote --file=migrations/0002_seed_data.sql
          else
            echo "CLOUDFLARE_API_TOKEN not set in GitHub Secrets. Skipping automated remote D1 migration."
          fi

